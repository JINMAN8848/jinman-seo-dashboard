# SEO Dashboard build & deploy
# Triggers:
#   1. push to main when dist/index.html is updated (after local build)
#   2. weekly cron Monday 09:00 Asia/Shanghai = Sunday 01:00 UTC
#      (auto-refresh: requires latest seo-data/ CSVs to be committed too)
#
# Deploy target: Cloudflare Pages project `jinman-seo-dashboard`
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN   - CF API token with Pages:Edit permission
#   CLOUDFLARE_ACCOUNT_ID  - CF account id (32-char hex)
#
# Red lines:
#   * No secrets in workflow file (only ${{ secrets.* }})
#   * No USD paid API
#   * No Co-authored-by trailer

name: SEO Dashboard · build & deploy

on:
  push:
    branches: [main]
    paths:
      - 'dist/index.html'
      - 'build.mjs'
      - 'src/template.html'
      - '.github/workflows/dashboard-build.yml'
  workflow_dispatch:
  schedule:
    # Every Monday 09:00 Asia/Shanghai = Sunday 01:00 UTC
    - cron: '0 1 * * 1'

# Avoid concurrent deploys when push + cron fire close together.
concurrency:
  group: seo-dashboard-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # No-op build: dist/index.html is the artifact committed by the boss's
      # local `node build.mjs` run. The cron branch (Monday 09:00) only deploys
      # the existing artifact — it does NOT rebuild, because seo-data/ lives on
      # the boss's PC and is not in this repo.
      - name: Validate dist exists
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html missing — run `node build.mjs` locally and commit."
            exit 1
          fi
          echo "deploying $(stat -c '%s bytes' dist/index.html)"

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler pages deploy dist --project-name=jinman-seo-dashboard --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        run: |
          echo "### SEO Dashboard deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- artifact bytes: $(stat -c '%s' dist/index.html)" >> "$GITHUB_STEP_SUMMARY"